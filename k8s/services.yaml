apiVersion: v1
kind: Service
metadata:
  name: ticket-stable
  namespace: delivery-lab
spec:
  selector:
    app: ticket-api
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-canary
  namespace: delivery-lab
spec:
  selector:
    app: ticket-api
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notification-worker
  namespace: delivery-lab
spec:
  selector:
    app: notification-worker
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: delivery-lab
spec:
  selector:
    app: web-frontend
  ports:
    - port: 8000
      targetPort: http

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-api
  namespace: delivery-lab
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ticket-stable
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: delivery-lab
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend
                port:
                  number: 8000
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-worker
                port:
                  number: 8000
